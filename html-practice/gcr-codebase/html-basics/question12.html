<!DOCTYPE html>
<html>
<head>
    <title>Inline Formatting Example</title>
</head>
<body>
    <p>
        Reading is my <strong>favorite hobby</strong> because it lets me explore
        <em>new worlds and ideas</em>.<br>
        I always <mark>enjoy reading</mark> in my free time.
        <small>Books make learning fun and interesting!</small>
    </p>
</body>
</html>
